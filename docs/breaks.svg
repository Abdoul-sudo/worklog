<svg xmlns="http://www.w3.org/2000/svg" width="880" height="262" viewBox="0 0 880 262" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One day with Worklog: work always counts, a short 30 min break counts as work when you come back, Worklog asks about a long 2h break, the night is a very long break and does not count.</title>
  <defs>
    <clipPath id="barre"><rect x="32" y="88" width="816" height="36" rx="7"/></clipPath>
  </defs>
  <rect width="880" height="262" rx="14" fill="#0B1220"/>
  <text x="32" y="42" fill="#F4F6FB" font-size="17" font-weight="600">One day with Worklog</text>
  <text x="32" y="65" fill="#8A93B2" font-size="13">Default settings: stay active during breaks up to 1h, then ask up to 4h.</text>

  <!-- La journée -->
  <g clip-path="url(#barre)">
    <rect x="32" y="88" width="120" height="36" fill="#4FD1C5"/>
    <rect x="152" y="88" width="70" height="36" fill="#4FD1C5" fill-opacity=".38"/>
    <rect x="222" y="88" width="150" height="36" fill="#4FD1C5"/>
    <rect x="372" y="88" width="150" height="36" fill="#E8BE6A" fill-opacity=".45"/>
    <rect x="522" y="88" width="190" height="36" fill="#4FD1C5"/>
    <rect x="712" y="88" width="136" height="36" fill="#2B3350"/>
  </g>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <text x="92" y="111" fill="#04201E">Work</text>
    <text x="187" y="111" fill="#EFFFFC">30 min</text>
    <text x="297" y="111" fill="#04201E">Work</text>
    <text x="447" y="111" fill="#FFF6E0">2h break</text>
    <text x="617" y="111" fill="#04201E">Work</text>
    <text x="780" y="111" fill="#AEB6D0">Night</text>
  </g>
  <g font-size="12" fill="#8A93B2" text-anchor="middle">
    <text x="32" y="144" text-anchor="start">9:00</text>
    <text x="152" y="144">10:00</text>
    <text x="222" y="144">10:30</text>
    <text x="372" y="144">12:00</text>
    <text x="522" y="144">14:00</text>
    <text x="712" y="144">18:00</text>
    <text x="848" y="144" text-anchor="end">9:00</text>
  </g>

  <!-- La légende -->
  <line x1="32" y1="164" x2="848" y2="164" stroke="#1E2740"/>
  <g font-size="13">
    <rect x="32" y="182" width="14" height="14" rx="3" fill="#4FD1C5"/>
    <text x="56" y="194" fill="#E6E9F2"><tspan font-weight="600">Work</tspan><tspan fill="#8A93B2">: always counts.</tspan></text>
    <rect x="440" y="182" width="14" height="14" rx="3" fill="#4FD1C5" fill-opacity=".38"/>
    <text x="464" y="194" fill="#E6E9F2"><tspan font-weight="600">Short break, up to 1h</tspan><tspan fill="#8A93B2">: counts as work.</tspan></text>
    <rect x="32" y="218" width="14" height="14" rx="3" fill="#E8BE6A" fill-opacity=".45"/>
    <text x="56" y="230" fill="#E6E9F2"><tspan font-weight="600">Long break, 1h to 4h</tspan><tspan fill="#8A93B2">: Worklog asks you.</tspan></text>
    <rect x="440" y="218" width="14" height="14" rx="3" fill="#2B3350"/>
    <text x="464" y="230" fill="#E6E9F2"><tspan font-weight="600">Very long break</tspan><tspan fill="#8A93B2">: does not count.</tspan></text>
  </g>
</svg>
